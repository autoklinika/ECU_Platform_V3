name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            cxx: g++
            linux: "ON"
          - name: linux-clang
            cxx: clang++
            linux: "ON"
          - name: portable-without-linux-layer
            cxx: g++
            linux: "OFF"
          - name: linux-gcc-asan-ubsan
            cxx: g++
            linux: "ON"
            flags: "-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DECU_BUILD_LINUX_PLATFORM=${{ matrix.linux }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
